<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل المقطع</title>
    <!-- مكتبة تلجرام للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
        }
        h2 { font-size: 18px; margin-bottom: 15px; }
        .btn {
            background-color: #24A1DE;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .timer { font-size: 24px; font-weight: bold; color: #24A1DE; margin: 10px 0; }
    </style>

    <!-- ⚠️ ضع كود Adsterra Social Bar الخاص بك هنا ⚠️ -->
    <!-- مثال لكود السكريبت الذي تعطيك إياه Adsterra: -->
    <!-- <script type='text/javascript' src='//plXXXXX.gslb.adsterra.com/...'></script> -->

</head>
<body>

<div class="container">
    <h2>🚀 جاري تجهيز المقطع للتحميل...</h2>
    <div id="timer" class="timer">5</div>
    <p>انتظر بضع ثوانٍ ليتم تحضير رابط التحميل المباشر</p>
    
    <a id="downloadBtn" href="#" class="btn" style="display:none;">📥 اضغط هنا للتحميل الآن</a>
</div>

<script>
    // تهيئة تطبيق التلجرام المصغر
    const tg = window.Telegram.WebApp;
    tg.expand(); // فتح الشاشة بالكامل

    // استخراج رابط الفيديو الممرر عبر الـ URL
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('video_url');

    let timeLeft = 5;
    const timerElement = document.getElementById('timer');
    const downloadBtn = document.getElementById('downloadBtn');

    const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerElement.style.display = 'none';
            if (videoUrl) {
                downloadBtn.href = videoUrl;
                downloadBtn.style.display = 'block';
            }
        }
    }, 1000);
</script>

</body>
</html>
