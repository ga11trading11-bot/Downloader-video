<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل المقطع</title>
    <!-- مكتبة تلجرام الرسمية للـ Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 360px;
        }
        h2 { font-size: 18px; margin-bottom: 12px; }
        p { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; }
        .timer {
            font-size: 32px;
            font-weight: bold;
            color: #24a1de;
            margin: 15px 0;
        }
        .btn {
            background-color: #24a1de;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .btn:hover { background-color: #1c82b6; }
        .coupon-box {
            margin-top: 20px;
            padding: 10px;
            background: rgba(36, 161, 222, 0.1);
            border: 1px dashed #24a1de;
            border-radius: 10px;
            font-size: 13px;
        }
    </style>

    <!-- كود Adsterra Social Bar الذي أرسلته -->
    <script type="text/javascript" src="https://bicea.org/14/418b89558b12206f3d5b6ed69c8131b4"></script>

</head>
<body>

<div class="card">
    <h2>🚀 جاري تجهيز رابط التحميل...</h2>
    <div id="timer" class="timer">5</div>
    <p id="statusText">يرجى الانتظار بضع ثوانٍ لتحضير الفيديو بجودة عالية</p>

    <!-- زر التحميل المباشر يظهر بعد انتهاء العداد -->
    <a id="downloadBtn" href="#" class="btn" style="display:none;" target="_blank">📥 اضغط هنا للتحميل الآن</a>

    <!-- كود خصم نون لزيادة الأرباح -->
    <div class="coupon-box">
        🛍️ **كود خصم نون السعودية (خصم 10%):** <b style="color:#24a1de;">SA99</b>
    </div>
</div>

<script>
    // تهيئة واجهة تلجرام
    const tg = window.Telegram.WebApp;
    tg.expand();

    // جلب رابط الفيديو الممرر عبر الـ URL
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('video_url');

    let timeLeft = 5;
    const timerElement = document.getElementById('timer');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');

    // عداد التنازلي لمدة 5 ثوانٍ لعرض إعلان Social Bar وتحقيق الأرباح
    const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerElement.style.display = 'none';
            statusText.textContent = "✅ الرابط جاهز للتحميل!";
            if (videoUrl) {
                downloadBtn.href = decodeURIComponent(videoUrl);
                downloadBtn.style.display = 'block';
            }
        }
    }, 1000);
</script>

</body>
</html>
