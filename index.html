<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            text-align: center; 
            background: #f1f5f9; 
            color: #1e293b; 
            padding: 15px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card { 
            background: #ffffff; 
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h2 {
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .status { 
            font-size: 16px; 
            color: #475569; 
            margin-bottom: 15px;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            background: #e2e8f0;
            color: #166534;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        button.btn { 
            display: none; 
            width: 100%;
            background: #0ea5e9; 
            color: white; 
            padding: 16px; 
            border: none;
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 16px; 
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); 
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 25px;
        }
        button.btn:active {
            background: #0284c7;
        }
        .promo-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #334155;
            background: #f8fafc;
        }
        .error { 
            font-size: 15px; 
            color: #ef4444; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>تحميل المقطع 📥</h2>
        <div id="status" class="status">🚀 جاري تحضير رابط التحميل...</div>
        <div id="badge-container"></div>
        
        <button id="downloadBtn" class="btn">اضغط هنا للتحميل الآن 📥</button>

        <div class="promo-box">
            🎁 <b>كود خصم نون السعودية (خصم 10%):</b> <span style="color: #0ea5e9; font-weight: bold;">SA99</span>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function processVideo() {
            const urlParams = new URLSearchParams(window.location.search);
            const directUrl = urlParams.get('direct');
            const statusEl = document.getElementById('status');
            const badgeContainer = document.getElementById('badge-container');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!directUrl) {
                statusEl.className = "status error";
                statusEl.innerText = "❌ لم يتم العثور على رابط الفيديو!";
                return;
            }

            let countdown = 7;
            statusEl.innerText = `⏳ يرجى الانتظار (${countdown}) ثوانٍ...`;

            let timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    statusEl.innerText = `⏳ يرجى الانتظار (${countdown}) ثوانٍ...`;
                } else {
                    clearInterval(timer);
                    statusEl.innerText = "✅ تم تجهيز الرابط بنجاح!";
                    badgeContainer.innerHTML = '<span class="badge">✔ الرابط جاهز للتحميل</span>';
                    
                    downloadBtn.style.display = "block";
                    downloadBtn.onclick = function() {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.openLink(directUrl);
                        } else {
                            window.open(directUrl, '_blank');
                        }
                    };
                }
            }, 1000);
        }

        processVideo();
    </script>
</body>
</html>
