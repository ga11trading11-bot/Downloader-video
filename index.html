<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: #fff; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            margin-top: 50px; 
        }
        a.btn { 
            display: inline-block; 
            background: #10b981; 
            color: white; 
            padding: 14px 28px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            margin-top: 20px; 
            font-size: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        }
        .loading { 
            font-size: 18px; 
            color: #f59e0b; 
            margin-top: 20px; 
        }
        .error { 
            font-size: 16px; 
            color: #ef4444; 
            margin-top: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>تحميل المقطع 📥</h2>
        <p id="status" class="loading">⏳ جاري معالجة الرابط عبر جهازك...</p>
        <div id="result"></div>
    </div>

    <script>
        async function processVideo() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            if (!videoUrl) {
                statusEl.className = "error";
                statusEl.innerText = "❌ لم يتم العثور على أي رابط!";
                return;
            }

            try {
                const response = await fetch("https://api.cobalt.tools/api/json", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ url: videoUrl, vQuality: "720" })
                });

                const data = await response.json();
                let directUrl = null;

                if (data.url) {
                    directUrl = data.url;
                } else if (data.picker && data.picker.length > 0) {
                    directUrl = data.picker[0].url;
                }

                if (directUrl) {
                    statusEl.innerText = "✅ تم تجهيز الفيديو بنجاح!";
                    resultEl.innerHTML = `<a class="btn" href="${directUrl}" target="_blank">📥 اضغط هنا للتحميل المباشر</a>`;
                } else {
                    statusEl.className = "error";
                    statusEl.innerText = "❌ تعذر استخراج الرابط. تأكد أن الحساب عام وليس خاصاً.";
                }
            } catch (err) {
                statusEl.className = "error";
                statusEl.innerText = "❌ حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.";
            }
        }

        processVideo();
    </script>
</body>
</html>
