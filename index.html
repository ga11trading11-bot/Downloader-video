<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <!-- تضمين مكتبة تيليجرام Web App الرسمية لدعم الفتح الخارجي -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: #fff; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            margin-top: 50px; 
        }
        button.btn, a.btn { 
            display: inline-block; 
            background: #10b981; 
            color: white; 
            padding: 14px 28px; 
            text-decoration: none; 
            border: none;
            border-radius: 10px; 
            font-weight: bold; 
            margin-top: 20px; 
            font-size: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            cursor: pointer;
        }
        .loading { 
            font-size: 18px; 
            color: #f59e0b; 
            margin-top: 20px; 
        }
        .error { 
            font-size: 16px; 
            color: #ef4444; 
            margin-top: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>تحميل المقطع 📥</h2>
        <p id="status" class="loading">⏳ جاري معالجة الرابط عبر السيرفر...</p>
        <div id="result"></div>
    </div>

    <script>
        // إعدادات الـ Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function processVideo() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            if (!videoUrl) {
                statusEl.className = "error";
                statusEl.innerText = "❌ لم يتم العثور على أي رابط!";
                return;
            }

            try {
                // استخدام رابط سيرفرك المباشر
                const renderBackendUrl = "https://downloader-video-gxmp.onrender.com/api/extract?url=" + encodeURIComponent(videoUrl);

                const response = await fetch(renderBackendUrl);
                const data = await response.json();

                if (data.success && data.download_url) {
                    // بدء عداد الانتظار (7 ثوانٍ) قبل إظهار زر التحميل
                    let countdown = 7;
                    statusEl.innerText = `⏳ يرجى الانتظار (${countdown}) ثوانٍ...`;

                    let timer = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            statusEl.innerText = `⏳ يرجى الانتظار (${countdown}) ثوانٍ...`;
                        } else {
                            clearInterval(timer);
                            statusEl.innerText = "✅ تم تجهيز الفيديو بنجاح!";
                            
                            // إنشاء زر عند الضغط عليه يتم فتح الرابط في المتصفح الخارجي
                            const downloadBtn = document.createElement('button');
                            downloadBtn.className = 'btn';
                            downloadBtn.innerText = '📥 اضغط هنا للتحميل المباشر';
                            
                            downloadBtn.onclick = function() {
                                if (window.Telegram && window.Telegram.WebApp) {
                                    // فتح الرابط بالمتصفح الخارجي رسمياً عبر تليجرام
                                    window.Telegram.WebApp.openLink(data.download_url);
                                } else {
                                    window.open(data.download_url, '_blank');
                                }
                            };
                            
                            resultEl.appendChild(downloadBtn);
                        }
                    }, 1000);

                } else {
                    statusEl.className = "error";
                    statusEl.innerText = "❌ تعذر استخراج الرابط. تأكد أن الحساب عام وليس خاصاً.";
                }
            } catch (err) {
                statusEl.className = "error";
                statusEl.innerText = "❌ حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.";
            }
        }

        processVideo();
    </script>
</body>
</html>
